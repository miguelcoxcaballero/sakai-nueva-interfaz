<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <style>
    body { width: 300px; margin: 0; padding: 16px; font: 14px/1.4 "Google Sans", Roboto, "Segoe UI", Arial, sans-serif; color: #3c4043; }
    h1 { margin: 0 0 4px; font-size: 16px; font-weight: 500; color: #202124; }
    .host { margin-bottom: 12px; font-size: 12px; color: #5f6368; word-break: break-all; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; }
    .switch { position: relative; width: 36px; height: 14px; border: 0; padding: 0; border-radius: 7px; background: #bdc1c6; cursor: pointer; flex: none; }
    .switch::after { content: ''; position: absolute; top: -3px; left: -2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.4); transition: transform .15s, background .15s; }
    .switch.on { background: #8ab4f8; }
    .switch.on::after { transform: translateX(20px); background: #1a73e8; }
    .status { display: flex; gap: 8px; align-items: flex-start; margin: 4px 0 8px; padding: 8px 10px; border-radius: 8px; background: #f1f3f4; font-size: 13px; }
    .status::before { content: ''; width: 8px; height: 8px; margin-top: 6px; border-radius: 50%; background: #9aa0a6; flex: none; }
    .status.ok::before { background: #1e8e3e; }
    .status.warn::before { background: #f9ab00; }
    .status.bad::before { background: #d93025; }
    button.btn { width: 100%; height: 36px; margin-top: 8px; border: 0; border-radius: 4px; background: #1a73e8; color: #fff; font: inherit; font-weight: 500; cursor: pointer; }
    button.btn.o { background: #fff; color: #1a73e8; border: 1px solid #dadce0; }
    .note { margin-top: 12px; font-size: 12px; color: #5f6368; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <h1>Nueva interfaz para Sakai</h1>
  <div class="host" id="host"></div>

  <div id="on-site" hidden>
    <div class="row"><span>Nueva interfaz</span><button class="switch" id="toggle" role="switch" aria-checked="false"></button></div>
    <div class="status" id="status"></div>
    <button class="btn" id="action" hidden></button>
    <button class="btn o" id="remove" hidden>Dejar de usarla en este sitio</button>
  </div>

  <div id="off-site" hidden>
    <div>¿Es esta página un aula virtual hecha con Sakai?</div>
    <button class="btn" id="add">Usar la nueva interfaz en este sitio</button>
  </div>

  <div id="unsupported" hidden>Abre tu aula virtual (por ejemplo PoliformaT o el Aula Virtual de la UM) y vuelve a pulsar este botón.</div>

  <div class="note">Funciona con aulas virtuales basadas en Sakai. Tus datos no salen de tu navegador.</div>
  <script src="popup.js"></script>
</body>
</html>
