<!doctype html>
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; font-family: "Segoe UI", Roboto, Arial, sans-serif; }
  .bg { position: relative; width: 440px; height: 280px; background: linear-gradient(135deg, #1967d2, #129eaf); color: #fff; }
  .c { position: absolute; border-radius: 50%; background: rgba(255,255,255,.1); }
  .t { position: absolute; left: 28px; top: 34px; right: 28px; }
  h1 { margin: 0 0 8px; font-size: 32px; line-height: 38px; font-weight: 600; }
  p { margin: 0; font-size: 16px; opacity: .92; }
  .cards { position: absolute; left: 28px; bottom: 26px; display: flex; gap: 10px; }
  .card { width: 88px; height: 64px; border-radius: 8px; background: #fff; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,.2); }
  .card i { display: block; height: 24px; }
</style></head><body><div class="bg">
  <div class="c" style="width:220px;height:220px;right:-60px;top:-70px"></div>
  <div class="c" style="width:120px;height:120px;right:40px;bottom:-50px"></div>
  <div class="t"><h1>Nueva interfaz<br>para Sakai</h1><p>Una interfaz moderna y limpia para tu aula virtual</p></div>
  <div class="cards">
    <div class="card"><i style="background:#137333"></i></div>
    <div class="card"><i style="background:#e37400"></i></div>
    <div class="card"><i style="background:#9334e6"></i></div>
    <div class="card"><i style="background:#c5221f"></i></div>
  </div>
</div></body></html>
